<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贺砚</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #111; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.phone-frame { width: 340px; height: 700px; max-height: 95vh; background: #000; border-radius: 38px; padding: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 2px #333; position: relative; }
.phone-frame::before { content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 100px; height: 22px; background: #000; border-radius: 0 0 14px 14px; z-index: 10; }
.phone { width: 100%; height: 100%; border-radius: 30px; overflow: hidden; display: flex; flex-direction: column; background: #ededed; position: relative; }
.status-bar { flex-shrink: 0; height: 40px; background: #ededed; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 13px; font-weight: 600; color: #000; position: relative; z-index: 5; }
.status-right { display: flex; align-items: center; gap: 5px; }
.signal { display: flex; align-items: flex-end; gap: 1.5px; height: 11px; }
.signal span { width: 3px; background: #000; border-radius: 1px; }
.signal span:nth-child(1) { height: 4px; }
.signal span:nth-child(2) { height: 6px; }
.signal span:nth-child(3) { height: 8px; }
.signal span:nth-child(4) { height: 11px; }
.wifi { width: 14px; height: 11px; position: relative; }
.wifi::before, .wifi::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); border: 2px solid #000; border-bottom: none; border-left-color: transparent; border-right-color: transparent; border-radius: 50% 50% 0 0; }
.wifi::before { width: 14px; height: 7px; top: 0; }
.wifi::after { width: 7px; height: 4px; top: 3px; }
.battery { display: flex; align-items: center; gap: 1px; }
.battery-body { width: 20px; height: 10px; border: 1.5px solid #000; border-radius: 3px; padding: 1.5px; }
.battery-level { height: 100%; background: #000; border-radius: 1px; }
.battery-tip { width: 1.5px; height: 4px; background: #000; border-radius: 0 2px 2px 0; }
.nav-bar { flex-shrink: 0; height: 46px; background: #ededed; border-bottom: 1px solid #d6d6d6; display: flex; align-items: center; justify-content: center; position: relative; font-size: 17px; font-weight: 600; color: #000; }
.nav-back { position: absolute; left: 16px; display: flex; align-items: center; }
.nav-back::before { content: ''; width: 10px; height: 10px; border-left: 2px solid #000; border-bottom: 2px solid #000; transform: rotate(45deg); }
.chat { flex: 1; overflow-y: auto; padding: 12px 12px 16px; background: #ededed; -webkit-overflow-scrolling: touch; }
.chat::-webkit-scrollbar { width: 4px; }
.chat::-webkit-scrollbar-thumb { background: #c0c0c0; border-radius: 2px; }
.time-stamp { text-align: center; font-size: 12px; color: #999; margin: 8px 0 12px; }
.msg-row { display: flex; margin-bottom: 14px; align-items: flex-start; gap: 8px; }
.msg-row.user { flex-direction: row-reverse; }
.avatar { flex-shrink: 0; width: 38px; height: 38px; border-radius: 4px; background: #2a2a2a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.avatar.user-avatar { background: #4ade80; color: #143d1f; }
.bubble { max-width: 68%; padding: 9px 13px; border-radius: 6px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-break: break-word; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.05); }
.bubble.assistant { background: #ffffff; color: #000; }
.bubble.assistant::before { content: ''; position: absolute; left: -6px; top: 12px; border: 6px solid transparent; border-right-color: #ffffff; border-left: 0; }
.bubble.user { background: #95ec69; color: #000; }
.bubble.user::before { content: ''; position: absolute; right: -6px; top: 12px; border: 6px solid transparent; border-left-color: #95ec69; border-right: 0; }
.typing { display: flex; gap: 3px; padding: 4px 2px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: #999; animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
.input-bar { flex-shrink: 0; display: flex; align-items: flex-end; gap: 8px; padding: 8px 12px; background: #f7f7f7; border-top: 1px solid #d6d6d6; }
.input { flex: 1; padding: 9px 14px; border-radius: 6px; border: none; background: #fff; color: #000; font-size: 15px; outline: none; min-width: 0; font-family: inherit; }
.input::placeholder { color: #b2b2b2; }
.send-btn { flex-shrink: 0; padding: 9px 16px; border-radius: 6px; border: none; background: #07c160; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
.send-btn:disabled { background: #d0d0d0; color: #f5f5f5; }
.home-bar { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); width: 110px; height: 4px; background: #000; border-radius: 2px; opacity: 0.3; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const API_URL = '/api/chat'
const { createApp, ref, nextTick, onMounted } = Vue

createApp({
  setup() {
    const nowTime = ref('')
    const battery = ref(80)
    function updateTime() {
      const d = new Date()
      nowTime.value = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0')
    }
    onMounted(() => { updateTime(); setInterval(updateTime, 10000) })

    const messages = ref([
      { role: 'assistant', content: '在的，今天过得还好吗？' }
    ])
    const input = ref('')
    const chatRef = ref(null)
    const loading = ref(false)

    async function scrollToBottom() {
      await nextTick()
      if (chatRef.value) chatRef.value.scrollTop = chatRef.value.scrollHeight
    }

    async function send() {
      const text = input.value.trim()
      if (!text || loading.value) return
      messages.value.push({ role: 'user', content: text })
      input.value = ''
      await scrollToBottom()

      loading.value = true
      const aiIndex = messages.value.length
      messages.value.push({ role: 'assistant', content: '', typing: true })
      await scrollToBottom()

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: messages.value.slice(0, aiIndex).map(m => ({ role: m.role, content: m.content })),
          }),
        })
        if (!res.ok) {
          const err = await res.text()
          messages.value[aiIndex].content = '出错了：' + err
          messages.value[aiIndex].typing = false
          return
        }
        const reader = res.body.getReader()
        const decoder = new TextDecoder('utf-8')
        let buffer = ''
        messages.value[aiIndex].typing = false

        while (true) {
          const { done, value } = await reader.read()
          if (done) break
          buffer += decoder.decode(value, { stream: true })
          const lines = buffer.split('\n')
          buffer = lines.pop()
          for (const line of lines) {
            const t = line.trim()
            if (!t.startsWith('data:')) continue
            const data = t.slice(5).trim()
            if (data === '[DONE]') continue
            try {
              const json = JSON.parse(data)
              const delta = json.choices?.[0]?.delta?.content || ''
              if (delta) {
                messages.value[aiIndex].content += delta
                await scrollToBottom()
              }
            } catch (e) {}
          }
        }
      } catch (e) {
        messages.value[aiIndex].content = '网络错误：' + e.message
        messages.value[aiIndex].typing = false
      } finally {
        loading.value = false
      }
    }

    return { nowTime, battery, messages, input, chatRef, send, loading }
  },
  template: `
    <div class="phone-frame">
      <div class="phone">
        <div class="status-bar">
          <div>{{ nowTime }}</div>
          <div class="status-right">
            <div class="signal"><span></span><span></span><span></span><span></span></div>
            <div class="wifi"></div>
            <div class="battery">
              <div class="battery-body"><div class="battery-level" :style="{ width: battery + '%' }"></div></div>
              <div class="battery-tip"></div>
            </div>
          </div>
        </div>
        <div class="nav-bar"><div class="nav-back"></div><div>贺砚</div></div>
        <div class="chat" ref="chatRef">
          <div class="time-stamp">今天</div>
          <div v-for="(msg, i) in messages" :key="i" class="msg-row" :class="msg.role">
            <div class="avatar" :class="{ 'user-avatar': msg.role === 'user' }">{{ msg.role === 'user' ? '我' : '贺' }}</div>
            <div class="bubble" :class="msg.role">
              <div v-if="msg.typing" class="typing"><span></span><span></span><span></span></div>
              <template v-else>{{ msg.content }}</template>
            </div>
          </div>
        </div>
        <div class="input-bar">
          <input v-model="input" class="input" type="text" @keyup.enter="send" :disabled="loading" />
          <button class="send-btn" :disabled="!input.trim() || loading" @click="send">发送</button>
        </div>
        <div class="home-bar"></div>
      </div>
    </div>
  `
}).mount('#app')
</script>
</body>
</html>
